<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel Administrativo - BarberBook</title><link rel="stylesheet" href="style.css"><script src="config.js"></script><style>body{min-height:100vh}.admin{max-width:820px;margin:0 auto;padding:45px 20px}.admin h1{font-family:"Playfair Display",serif;font-size:2.6rem}.admin p{color:var(--muted)}.panel{margin-top:25px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}.field{margin-bottom:16px}.field label{display:block;color:#cbd8e6;font-weight:700;font-size:.85rem;margin-bottom:7px}.field input{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line-soft);background:#091728;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.msg{margin-top:15px;color:#7dd3fc;font-weight:700}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="admin"><a href="index.html" class="btn btn-ghost">← Voltar ao site</a><h1 style="margin-top:22px">Painel Administrativo</h1><p>Cadastre as informações da barbearia. Elas serão usadas automaticamente no site e ficam salvas neste navegador.</p><form id="form" class="panel"><div class="grid"><div class="field"><label>Nome da barbearia</label><input name="nome"></div><div class="field"><label>Slogan</label><input name="slogan"></div><div class="field"><label>Telefone</label><input name="telefone" placeholder="(18) 99999-9999"></div><div class="field"><label>WhatsApp com DDI</label><input name="whatsapp" placeholder="5518999999999"></div><div class="field"><label>Endereço</label><input name="endereco"></div><div class="field"><label>Horários</label><input name="horarios"></div><div class="field"><label>Instagram</label><input name="instagram" placeholder="https://instagram.com/..." ></div><div class="field"><label>Facebook</label><input name="facebook" placeholder="https://facebook.com/..." ></div><div class="field"><label>Latitude</label><input name="lat" placeholder="-21.2089"></div><div class="field"><label>Longitude</label><input name="lng" placeholder="-50.4328"></div></div><div class="field"><label>URL da foto da barbearia (opcional)</label><input name="foto_url" placeholder="https://.../foto.jpg"></div><div class="actions"><button class="btn btn-accent" type="submit">💾 Salvar informações</button><button class="btn btn-ghost" type="button" id="reset">Restaurar padrão</button></div><div class="msg" id="msg"></div></form></main><script>const form=document.getElementById("form");const preencher=()=>{const c=getConfig();Object.keys(c).forEach(k=>{if(form.elements[k])form.elements[k].value=c[k]})};preencher();form.addEventListener("submit",e=>{e.preventDefault();saveConfig(Object.fromEntries(new FormData(form)));document.getElementById("msg").textContent="✓ Informações salvas! Agora abra o site novamente.";});document.getElementById("reset").onclick=()=>{saveConfig(DEFAULT_CONFIG);preencher();document.getElementById("msg").textContent="Configurações restauradas.";};</script></body></html>
